"use strict";
const TOPICS=[
  {id:"policy",title:"Fiscal policy",sub:"Expansionary, contractionary, taxation and spending",icon:"↗"},
  {id:"budget",title:"Budget & revenue",sub:"Revenue, expenditure, deficit, surplus and balance",icon:"▤"},
  {id:"multiplier",title:"Multiplier effects",sub:"MPC, formulas, calculations and income changes",icon:"×"},

];
const mc=(id,topic,q,opts,a,explain,source,hint)=>({id,topic,type:"mc",q,opts,a,explain,source,hint});
const num=(id,topic,q,a,unit,explain,source,hint)=>({id,topic,type:"num",q,a,unit,explain,source,hint});
const frq=(id,topic,q,model,rubric,source,hint)=>({id,topic,type:"frq",q,model,rubric,source,hint});
const QUESTIONS=[
  // Fiscal policy: key terms, policy directions, and aggregate demand (page 1).
  mc("f01","policy","Which statement best defines fiscal policy?",["A plan listing expected government revenue and expenditure","The use of government spending and taxation to influence economic activity","The amount of income households save each month","The process of multiplying national income by tax revenue"],1,"Fiscal policy is the government's use of expenditure and taxes to influence economic activity.","Guide p.1 · Key vocabulary","Recall the government's two fiscal tools."),
  mc("f02","policy","Which option best describes government spending?",["Money paid by households in taxes","Money kept in a balanced budget","Government expenditure on goods, services and public projects","The fraction of extra income households consume"],2,"Government spending means expenditure on goods, services, public services and projects.","Guide p.1 · Key vocabulary","Distinguish government outflows from money it collects."),
  mc("f03","policy","What is taxation?",["Money collected by government from individuals and businesses","Money earned by employees on public projects","The amount the government spends on infrastructure","The difference between spending and government revenue"],0,"Taxation is money collected by government from individuals and businesses.","Guide p.1 · Key vocabulary","Think about money flowing into the public budget."),
  mc("f04","policy","Which change is typical of expansionary fiscal policy?",["Lower government spending","Higher income taxes","No changes in spending or taxation","Higher government spending"],3,"Expansionary fiscal policy can involve increasing government spending or reducing taxes to support activity.","Guide p.1 · Understanding fiscal policy","The goal is to stimulate activity."),
  mc("f05","policy","Which action is contractionary fiscal policy?",["Increasing public-project spending","Increasing taxation","Reducing taxes","Increasing government spending while taxes stay constant"],1,"Higher taxes are contractionary because they may reduce money available for private spending.","Guide p.1 · Understanding fiscal policy","The policy is meant to slow activity."),
  mc("f06","policy","When government expenditure increases under expansionary fiscal policy, aggregate demand may...",["Fall because spending has been withdrawn","Remain fixed by definition","Increase as new spending supports activity","Equal total government tax revenue"],2,"Additional government spending may raise aggregate demand and economic activity.","Guide p.1 · Expansionary policy","Trace the effect of new spending through the economy."),
  mc("f07","policy","What is a likely household effect when the government reduces taxes?",["Households may have more money available to spend","Households must immediately save all additional income","Government expenditure necessarily falls by an identical amount","Aggregate demand must become zero"],0,"Lower taxes can leave households with more money to spend, supporting economic activity.","Guide p.1 · Expansionary policy","Consider disposable money available to households."),
  mc("f08","policy","A government raises taxes to slow economic activity. Which effect best follows the study guide?",["Aggregate demand necessarily increases","Government spending must increase by the same amount","Households automatically receive higher wages","Households may have less money to spend"],3,"Higher taxation can reduce money available to households, decreasing aggregate demand.","Guide p.1 · Contractionary policy","Think about the effect of taxes on household spending capacity."),
  mc("f09","policy","Which is the main aim of contractionary fiscal policy?",["Expand public demand quickly","Slow economic activity","Increase national income through an added spending injection","Guarantee a government budget surplus"],1,"Contractionary fiscal policy aims to slow economic activity by reducing spending or increasing taxes.","Guide p.1–2 · Quick comparison","Focus on the policy's intended direction."),
  mc("f10","policy","Which pair of actions is clearly expansionary?",["Reduce spending and raise taxes","Reduce spending and leave taxes unchanged","Increase spending and reduce taxes","Raise taxes and leave spending unchanged"],2,"Increasing spending and reducing taxes are both expansionary actions that can support aggregate demand.","Guide p.2 · Policy comparison","Both actions should encourage economic activity."),
  mc("f11","policy","Which pair of actions is clearly contractionary?",["Reduce spending and raise taxes","Increase spending and reduce taxes","Increase spending and leave taxes unchanged","Reduce taxes and leave spending unchanged"],0,"Cutting government spending and raising taxes both tend to reduce aggregate demand.","Guide p.2 · Policy comparison","Both actions should work toward slowing activity."),
  mc("f12","policy","Economic activity is weak and the government wants to encourage more demand. Which policy direction fits the guide?",["Contractionary policy through higher taxes","Contractionary policy through reduced expenditure","A deficit alone without any policy action","Expansionary policy through increased government spending"],3,"Expansionary fiscal policy uses higher spending and/or lower taxes to increase activity.","Guide p.1–2 · Fiscal policy applications","Match the desired effect with the policy's goal."),

  // Government revenue, expenditure and the federal budget (pages 1–2).
  mc("b01","budget","Government revenue includes...",["Money paid for new roads","Money collected through taxes and other sources","The amount spent on public services","Only salaries paid to public employees"],1,"Revenue is money collected by the government, including taxes and other sources.","Guide p.2 · Government revenue","Revenue flows into the government."),
  mc("b02","budget","Which is an example of government expenditure?",["Taxes collected from a business","Other revenue received by government","Money collected from individuals","Government funding for public services"],3,"Government expenditure is money spent on goods, services and public projects.","Guide p.2 · Government spending","Expenditure flows out of the government budget."),
  mc("b03","budget","What is a government budget?",["A plan for expected government revenue and expenditure","A measure of the income households spend","The multiplier for additional government spending","A policy that always requires higher taxation"],0,"A government budget sets out how the government expects to collect and spend money.","Guide p.1–2 · Government budget","Think of a financial plan covering both inflows and outflows."),
  mc("b04","budget","A budget deficit occurs when...",["Revenue equals expenditure","Revenue exceeds expenditure","Expenditure exceeds revenue","Government spending is zero"],2,"A deficit occurs when government expenditure is greater than government revenue.","Guide p.2 · Deficit and notes","Your handwritten note compares what is spent with what is gained."),
  mc("b05","budget","Which condition creates a budget surplus?",["Expenditure exceeds revenue","Revenue exceeds expenditure","Revenue and expenditure are equal","Tax revenue is less than any individual project"],1,"A surplus means total government revenue is greater than total expenditure.","Guide p.2 · Surplus and notes","Compare money collected with money spent."),
  mc("b06","budget","When is the government budget balanced?",["When total revenue equals total expenditure","Whenever revenue exceeds spending","Whenever spending exceeds revenue","Whenever an expansionary policy is chosen"],0,"Balanced means revenue and expenditure are equal; the handwritten note labels this equilibrium.","Guide p.2 · Balanced budget + handwritten note","There is neither an excess of revenue nor an excess of expenditure."),
  mc("b07","budget","Government revenue is AED 70 million and expenditure is AED 90 million. What is the budget position?",["AED 20 million surplus","Balanced budget","AED 160 million deficit","AED 20 million deficit"],3,"Expenditure exceeds revenue by 90 − 70 = AED 20 million, so the budget is in deficit.","Guide p.2 · Budget definitions; applied numbers","Subtract revenue from expenditure when spending is greater."),
  mc("b08","budget","Government revenue is AED 130 million and expenditure is AED 110 million. What is the position?",["AED 20 million deficit","AED 240 million surplus","AED 20 million surplus","Balanced budget"],2,"Revenue is greater than expenditure by 130 − 110 = AED 20 million: a surplus.","Guide p.2 · Budget definitions; applied numbers","Compare the totals before classifying."),
  mc("b09","budget","A government collects AED 80 million and spends AED 80 million. Its budget is...",["Balanced","In deficit by AED 80 million","In surplus by AED 80 million","In deficit by AED 160 million"],0,"Equal revenue and expenditure create a balanced budget.","Guide p.2 · Balanced budget; applied numbers","Check whether the two totals differ."),
  mc("b10","budget","The government pays to build a new public hospital. How should the payment be classified?",["Tax revenue","Government expenditure","A budget surplus","Government revenue"],1,"Payment for a public project is government expenditure, not incoming revenue.","Guide p.2 · Government expenditure; applied example","A public project requires money to be paid out."),

  const feedback=!isExam&&done?`<div class="answer-box ${graded?.correct?"success":""}" role="status"><strong>${q.type==="frq"?"Model answer & marking checklist":graded?.correct?"Well done — correct answer":"Review this answer"}</strong><p>${esc(q.type==="frq"?q.model:q.explain)}</p>${q.type==="frq"?`<ul class="rubric">${q.rubric.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p><strong>Expected:</strong> ${esc(answerLabel(q))}</p>`}</div>`:"";
  const actionLabel=isExam?(s.idx===s.ids.length-1?"Finish exam":"Save & next →"):done?(s.idx===s.ids.length-1?"Finish & see results":"Next question →"):q.type==="frq"?"Reveal model response":"Check answer";
  app.innerHTML=`<div class="quiz-shell"><div class="quiz-heading"><div><span class="eyebrow">${isExam?"Exam simulation":"Practice mode"}</span><div class="quiz-meta">Question ${s.idx+1} of ${s.ids.length}</div></div><button class="ghost smallbtn" data-action="exit-quiz">← Back to dashboard</button></div><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="${s.ids.length}" aria-valuenow="${s.idx+1}" aria-label="Question progress"><div class="progress-fill" style="width:${100*(s.idx+1)/s.ids.length}%"></div></div><article class="question-card"><div class="question-source">${tag(topicLabel(q))}${tag(typeLabel(q),"neutral")}<span class="source">${esc(q.source)}</span></div><h2>${esc(q.q)}</h2>${opts}${!isExam&&!done&&state.hints.has(q.id)?`<div class="hintbox">Hint: ${esc(q.hint)}</div>`:""}${feedback}<div class="quiz-actions"><div>${!isExam&&!done?`<button class="ghost" data-action="hint">${state.hints.has(q.id)?"Hide hint":"Show a hint"}</button>`:""}</div><button class="primary" data-action="quiz-next" ${!isExam&&q.type!=="frq"&&!done&&!hasValue?"disabled":""}>${esc(actionLabel)}</button></div></article></div>`;
}
function finish(){const s=state.session;if(!s||s.finished)return;const items=s.ids.map(id=>{const q=lookup(id);return {id,correct:objective(q)?evaluate(q,s.answers[id]):null}});const objectiveItems=items.filter(x=>x.correct!==null),correct=objectiveItems.filter(x=>x.correct).length;for(const item of objectiveItems){if(item.correct)state.missed.delete(item.id);else state.missed.add(item.id)}
  const entry={date:Date.now(),mode:s.mode,questions:s.ids.length,objective:objectiveItems.length,correct,items};state.history.unshift(entry);state.history=state.history.slice(0,50);s.finished=true;s.result=entry;save();go("results")}
function results(){const s=state.session,entry=s?.result||state.history[0];if(!entry){go("study");return}const pct=entry.objective?Math.round(100*entry.correct/entry.objective):null;const written=entry.items.filter(x=>x.correct===null).length;
  app.innerHTML=`<div class="quiz-shell"><div class="panel" style="text-align:center;padding:36px"><span class="eyebrow">Session complete</span><h1 style="margin:17px 0 0">${pct===null?"Written review":"Your score"}</h1><div class="score">${pct===null?"—":pct+"%"}</div><p>${entry.objective?`${entry.correct} of ${entry.objective} objective questions answered correctly.`:"No automatically scored questions in this session."}${written?` ${written} written response${written>1?"s were":" was"} self-reviewed and excluded from the percentage.`:""}</p><div class="results-grid"><div class="result-stat"><strong>${entry.questions}</strong><small>Questions seen</small></div><div class="result-stat"><strong>${entry.correct}/${entry.objective}</strong><small>Auto-marked correct</small></div><div class="result-stat"><strong>${state.missed.size}</strong><small>Missed to revisit</small></div></div><div class="quiz-actions" style="justify-content:center"><button class="primary" data-action="new-session">New session →</button><button class="secondary" data-action="review-missed" ${state.missed.size?"":"disabled"}>Practice missed</button></div></div>${section("Review","Your answer review","Check the reasoning behind each answer, including the written-response criteria.")}<div class="panel">${entry.items.map((item,i)=>{const q=lookup(item.id);const answer=s?.answers?.[q.id];const yours=q.type==="mc"&&answer!==undefined?`${"ABCD"[Number(answer)]}. ${q.opts[Number(answer)]}`:q.type==="num"?(answer??"Not answered"):"";return `<div class="review-item"><div>${tag(topicLabel(q))} ${tag(item.correct===null?"Self-reviewed":item.correct?"Correct":"Needs review",item.correct===null?"neutral":"")}</div><strong>${i+1}. ${esc(q.q)}</strong>${item.correct!==null?`<p><b>Your answer:</b> ${esc(yours||"Not answered")}</p><p><b>Expected:</b> ${esc(answerLabel(q))}</p><p>${esc(q.explain)}</p>`:`<p><b>Your response:</b> ${esc(answer||"No response entered")}</p><p><b>Model response:</b> ${esc(q.model)}</p><ul class="rubric">${q.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>`}<div class="source">${esc(q.source)}</div></div>`}).join("")}</div></div>`;
}
function performance(){const count=state.history.length,allItems=state.history.flatMap(h=>h.items).filter(x=>x.correct!==null),correct=allItems.filter(x=>x.correct).length;const avg=count?Math.round(state.history.reduce((n,h)=>n+(h.objective?100*h.correct/h.objective:0),0)/count):0;
  app.innerHTML=`<div class="page-intro"><span class="eyebrow">Your private revision record</span><h1>Progress, made<br><em style="color:var(--wine)">visible.</em></h1><p>Your sessions are stored locally in this browser only. Nothing is uploaded or shared.</p></div><div class="statstrip"><div class="stat"><strong>${count}</strong><small>Completed sessions</small></div><div class="stat"><strong>${allItems.length?Math.round(100*correct/allItems.length)+"%":"—"}</strong><small>Objective accuracy</small></div><div class="stat"><strong>${state.missed.size}</strong><small>Questions to revisit</small></div></div><div class="cols"><div class="panel"><h3>Accuracy by topic</h3><p>Based on completed objective questions.</p>${TOPICS.map(t=>{const entries=allItems.filter(x=>lookup(x.id)?.topic===t.id),ok=entries.filter(x=>x.correct).length,p=entries.length?Math.round(100*ok/entries.length):0;return `<div class="topic-performance"><div class="row"><span>${esc(t.title)}</span><span>${entries.length?p+"%":"Not attempted"}</span></div><div class="barline"><span style="width:${p}%"></span></div></div>`}).join("")}<div class="spacer"></div><button class="primary" data-action="review-missed" ${state.missed.size?"":"disabled"}>Practice ${state.missed.size} missed questions →</button></div><div class="panel"><h3>Recent sessions</h3>${count?state.history.slice(0,10).map(h=>`<div class="history-row"><div><strong>${new Date(h.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</strong><small>${h.mode==="exam"?"Exam":"Practice"} · ${h.questions} questions</small></div><strong style="color:var(--wine)">${h.objective?Math.round(100*h.correct/h.objective)+"%":"Written"}</strong></div>`).join(""):`<div class="empty"><h3>No sessions yet</h3><p>Finish a quiz to track your improvement.</p></div>`}<div class="spacer"></div><button class="ghost smallbtn" data-action="clear-progress" ${count||state.missed.size?"":"disabled"}>Clear saved progress</button></div></div>`;
}
function render(){if(state.view==="bank")bank();else if(state.view==="quiz")quiz();else if(state.view==="results")results();else if(state.view==="progress")performance();else dashboard()}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;const view=b.dataset.view;if(view){state.notice="";go(view);return}
  if(b.dataset.topic){state.selected.has(b.dataset.topic)?state.selected.delete(b.dataset.topic):state.selected.add(b.dataset.topic);render();return}
  if(b.dataset.mode){state.mode=b.dataset.mode;if(state.mode==="exam")state.includeFRQ=false;render();return}
  switch(b.dataset.action){
    case "start":startQuiz();break;case "resume":go("quiz");break;case "exit-quiz":go("study");break;case "new-session":go("study");break;
    case "review-missed":startQuiz(true);break;case "practice-one":startQuiz(false,b.dataset.id);break;
    case "bank-reveal":state.bankOpen.has(b.dataset.id)?state.bankOpen.delete(b.dataset.id):state.bankOpen.add(b.dataset.id);renderBankCards();break;
    case "hint":{const q=lookup(state.session.ids[state.session.idx]);state.hints.has(q.id)?state.hints.delete(q.id):state.hints.add(q.id);quiz();break}
    case "choose":{const s=state.session,q=lookup(s.ids[s.idx]);if(s.graded[q.id]||s.revealed[q.id])return;s.answers[q.id]=Number(b.dataset.value);save();quiz();break}
    case "quiz-next":{const s=state.session,q=lookup(s.ids[s.idx]),isExam=s.mode==="exam";if(!isExam&&!s.graded[q.id]&&!s.revealed[q.id]){if(q.type==="frq")s.revealed[q.id]=true;else s.graded[q.id]={correct:evaluate(q,s.answers[q.id])};save();quiz();return}if(s.idx===s.ids.length-1)finish();else{s.idx++;save();quiz();window.scrollTo({top:0,behavior:"smooth"})}break}
    case "clear-progress":if(confirm("Delete saved quiz history and missed-question tracking from this browser?")){state.history=[];state.missed.clear();state.session=null;save();render()}break;
  }
});
document.addEventListener("change",e=>{
  const x=e.target;if(x.id==="countSelect"){state.count=x.value}else if(x.id==="writtenToggle"){state.includeFRQ=x.checked;render()}else if(x.id==="bankTopic"){state.bankTopic=x.value;renderBankCards()}else if(x.id==="bankType"){state.bankType=x.value;renderBankCards()}
});
document.addEventListener("input",e=>{
  const x=e.target;if(x.id==="bankSearch"){state.bankSearch=x.value;renderBankCards()}else if((x.id==="numericAnswer"||x.id==="writtenAnswer")&&state.session){const s=state.session,q=lookup(s.ids[s.idx]);s.answers[q.id]=x.value;save();const next=document.querySelector('[data-action="quiz-next"]');if(next&&x.id==="numericAnswer"&&s.mode!=="exam")next.disabled=!x.value.trim()}
});
render();
</script>
</body>
</html>
